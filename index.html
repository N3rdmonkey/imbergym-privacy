<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImberGym</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <!-- Ohne Skript: Deutsch. Mit Skript: Sprache des Browsers. -->
  <noscript><meta http-equiv="refresh" content="0; url=de/"></noscript>
  <script>
    var lang = (navigator.language || 'de').toLowerCase();
    if (lang.startsWith('de')) {
      location.replace('de/');
    } else if (lang.startsWith('es')) {
      location.replace('es/');
    } else if (lang.startsWith('fr')) {
      location.replace('fr/');
    } else {
      location.replace('en/');
    }
  </script>
</head>
<body style="background:#2A2825;color:#EDE8E1;font-family:sans-serif">
  <p><a href="de/" style="color:#FF7A1A">Deutsch</a> · <a href="en/" style="color:#FF7A1A">English</a> · <a href="es/" style="color:#FF7A1A">Español</a> · <a href="fr/" style="color:#FF7A1A">Français</a></p>
</body>
</html>
