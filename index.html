  <script>
    var lang = (navigator.language || 'de').toLowerCase();
    if (lang.startsWith('de')) {
      location.replace('de/');
    } else if (lang.startsWith('es')) {
      location.replace('es/');
    } else if (lang.startsWith('fr')) {
      location.replace('fr/');
    } else if (lang.startsWith('it')) {
      location.replace('it/');
    } else if (lang.startsWith('pt')) {
      location.replace('pt/');
    } else if (lang.startsWith('tr')) {
      location.replace('tr/');
    } else {
      location.replace('en/');
    }
  </script>
